<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products – Senim Furniture</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="nav-logo">Senim</a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="products.html" class="active">Furniture</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <button class="cart-btn" onclick="window.location.href='cart.html'" title="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="cart-count">0</span>
    </button>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<!-- PAGE BANNER -->
<div class="page-banner">
  <p class="page-banner-label">Our Collection</p>
  <h1 class="page-banner-title">All Furniture</h1>
  <p class="page-banner-desc">Explore our curated selection of handcrafted furniture for every room in your home.</p>
</div>

<!-- PRODUCTS SECTION -->
<section style="padding:60px 5%">

  <!-- Search & Sort Bar -->
  <div class="search-filter-bar">
    <div class="search-input-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search furniture...">
    </div>
    <select class="filter-select" id="sortSelect">
      <option value="">Sort by</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="name-asc">Name: A–Z</option>
    </select>
  </div>

  <!-- Category Filter Tabs -->
  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-cat="">All Products</button>
    <button class="filter-tab" data-cat="Sofas">Sofas</button>
    <button class="filter-tab" data-cat="Armchairs">Armchairs</button>
    <button class="filter-tab" data-cat="Chairs">Chairs</button>
    <button class="filter-tab" data-cat="Tables">Tables</button>
    <button class="filter-tab" data-cat="Curtains">Curtains</button>
    <button class="filter-tab" data-cat="Pillows">Pillows</button>
  </div>

  <!-- Results count -->
  <p id="resultsCount" style="color:var(--gray);font-size:.85rem;margin-bottom:20px"></p>

  <!-- Products Grid -->
  <div class="products-grid" id="productsGrid">
    <div class="loading-spinner" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
</section>

<footer class="footer">
  <div class="footer-bottom" style="border:none;padding:30px 5%">
    <span>© 2025 Senim Furniture</span>
    <a href="../index.html" class="nav-logo" style="font-size:1.2rem">Senim</a>
    <a href="contact.html" style="color:rgba(255,255,255,.5)">Contact Us</a>
  </div>
</footer>

<div class="toast-container"></div>
<script src="../js/main.js"></script>
<script>
  let allProducts = [];
  let activeCategory = '';

  // Read URL param for category
  const urlParams = new URLSearchParams(window.location.search);
  const urlCategory = urlParams.get('category') || '';

  async function initProducts() {
    allProducts = await loadProducts();
    if (urlCategory) {
      activeCategory = urlCategory;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.cat === urlCategory);
      });
    }
    renderProducts();
  }

  function renderProducts() {
    const grid = document.getElementById('productsGrid');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const sort = document.getElementById('sortSelect').value;

    let filtered = allProducts.filter(p => {
      const matchCat = !activeCategory || p.category === activeCategory;
      const matchSearch = !search ||
        p.name.toLowerCase().includes(search) ||
        (p.description || '').toLowerCase().includes(search) ||
        (p.category || '').toLowerCase().includes(search);
      return matchCat && matchSearch;
    });

    if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
    else if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
    else if (sort === 'name-asc') filtered.sort((a,b) => a.name.localeCompare(b.name));

    document.getElementById('resultsCount').textContent =
      `Showing ${filtered.length} product${filtered.length !== 1 ? 's' : ''}`;

    grid.innerHTML = '';
    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <h3>No products found</h3>
          <p>Try adjusting your search or filter.</p>
          <button class="btn btn-outline" style="margin-top:16px" onclick="clearFilters()">Clear Filters</button>
        </div>`;
      return;
    }
    filtered.forEach(p => grid.appendChild(createProductCard(p)));
  }

  function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('sortSelect').value = '';
    activeCategory = '';
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === ''));
    renderProducts();
  }

  // Events
  document.getElementById('searchInput').addEventListener('input', renderProducts);
  document.getElementById('sortSelect').addEventListener('change', renderProducts);

  document.getElementById('filterTabs').addEventListener('click', e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    activeCategory = tab.dataset.cat;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderProducts();
  });

  initProducts();
</script>
</body>
</html>
