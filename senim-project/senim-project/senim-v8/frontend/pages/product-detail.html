<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail – Senim Furniture</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="nav-logo">Senim</a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="products.html" class="active">Furniture</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <button class="cart-btn" onclick="window.location.href='cart.html'" title="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="cart-count">0</span>
    </button>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div id="detail-content">
  <div class="loading-spinner" style="min-height:80vh;display:flex;align-items:center">
    <div class="spinner"></div>
  </div>
</div>

<!-- RELATED PRODUCTS -->
<section style="background:var(--beige);padding:60px 5%" id="related-section" hidden>
  <p class="section-label">You May Also Like</p>
  <h2 class="section-title">Related <span>Products</span></h2>
  <div class="products-grid" id="related-products" style="margin-top:32px"></div>
</section>

<footer class="footer">
  <div class="footer-bottom" style="border:none;padding:30px 5%">
    <span>© 2025 Senim Furniture</span>
    <a href="../index.html" class="nav-logo" style="font-size:1.2rem">Senim</a>
    <a href="contact.html" style="color:rgba(255,255,255,.5)">Contact Us</a>
  </div>
</footer>

<div class="toast-container"></div>
<script src="../js/main.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const productId = parseInt(urlParams.get('id'));

  async function loadDetail() {
    const container = document.getElementById('detail-content');
    let product = await API.get(`/products/${productId}`);

    if (!product) {
      // Fallback to sample data
      product = SAMPLE_PRODUCTS.find(p => p.id === productId);
    }

    if (!product) {
      container.innerHTML = `
        <div class="empty-state" style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <h3>Product Not Found</h3>
          <a href="products.html" class="btn btn-primary" style="margin-top:16px">Back to Products</a>
        </div>`;
      return;
    }

    document.title = `${product.name} – Senim Furniture`;

    container.innerHTML = `
      <div class="product-detail-layout" style="padding:100px 5% 60px">
        <div class="product-detail-gallery">
          <div class="main-image">
            <img src="${product.imageUrl || '../images/placeholder.jpg'}" alt="${product.name}"
                 onerror="this.src='https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600'" id="mainImg">
          </div>
          <div style="display:flex;gap:10px;margin-top:12px" id="thumbs">
            <div style="width:80px;height:80px;border-radius:8px;overflow:hidden;border:2px solid var(--green);cursor:pointer">
              <img src="${product.imageUrl || '../images/placeholder.jpg'}" style="width:100%;height:100%;object-fit:cover"
                   onerror="this.src='https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600'">
            </div>
          </div>
        </div>

        <div class="product-detail-info">
          <nav class="breadcrumb">
            <a href="../index.html">Home</a>
            <span>/</span>
            <a href="products.html">Products</a>
            <span>/</span>
            <a href="products.html?category=${product.category}">${product.category}</a>
            <span>/</span>
            <span>${product.name}</span>
          </nav>

          <div class="detail-category">${product.category}</div>
          <h1 class="detail-title">${product.name}</h1>

          <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
            <div class="detail-price">${formatPrice(product.price)}</div>
            <span class="tag ${product.stock > 0 ? 'tag-green' : ''}" style="${product.stock === 0 ? 'background:#fee2e2;color:#e53e3e' : ''}">
              ${product.stock > 0 ? `In Stock (${product.stock})` : 'Out of Stock'}
            </span>
          </div>

          <p class="detail-desc">${product.description || 'No description available.'}</p>

          <div class="detail-meta">
            ${product.material ? `<div class="meta-item"><label>Material</label><span>${product.material}</span></div>` : ''}
            ${product.color ? `<div class="meta-item"><label>Color</label><span>${product.color}</span></div>` : ''}
            <div class="meta-item"><label>Category</label><span>${product.category}</span></div>
            <div class="meta-item"><label>SKU</label><span>SNM-${String(product.id).padStart(4,'0')}</span></div>
          </div>

          <div class="detail-actions">
            <button class="btn btn-primary" onclick="addToCartDetail()" ${product.stock === 0 ? 'disabled style="opacity:.4"' : ''}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              Add to Cart
            </button>
            <button class="btn btn-outline" onclick="window.location.href='cart.html'">
              View Cart
            </button>
          </div>

          <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--beige-dark)">
            <div style="display:flex;gap:24px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--gray)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                Free delivery over 50,000 ₸
              </div>
              <div style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--gray)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                30-day returns
              </div>
              <div style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--gray)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                2-year warranty
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    // Store product for addToCart function
    window._currentProduct = product;

    // Load related
    loadRelated(product.category, product.id);
  }

  function addToCartDetail() {
    if (window._currentProduct) {
      Cart.addItem(window._currentProduct);
    }
  }

  async function loadRelated(category, currentId) {
    const allProducts = await loadProducts(category);
    const related = (allProducts || SAMPLE_PRODUCTS.filter(p => p.category === category))
      .filter(p => p.id !== currentId)
      .slice(0, 4);

    if (related.length > 0) {
      const section = document.getElementById('related-section');
      const grid = document.getElementById('related-products');
      section.hidden = false;
      related.forEach(p => grid.appendChild(createProductCard(p)));
    }
  }

  loadDetail();
</script>
</body>
</html>
