<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders – Senim Furniture</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .orders-page { padding: 100px 5% 60px; min-height: 80vh; }
    .orders-header { margin-bottom: 36px; }
    .orders-header h1 { font-family: var(--font-display); font-size: 2rem; color: var(--dark); }
    .order-card {
      background: white;
      border: 1.5px solid var(--beige-dark);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 20px;
    }
    .order-card-header {
      display: flex; justify-content: space-between;
      align-items: flex-start; flex-wrap: wrap; gap: 12px;
      padding-bottom: 16px; border-bottom: 1px solid var(--beige-dark);
      margin-bottom: 16px;
    }
    .order-id   { font-weight: 700; color: var(--dark); font-size: 1rem; }
    .order-date { font-size: .8rem; color: var(--gray); margin-top: 2px; }
    .order-status {
      padding: 4px 14px; border-radius: 20px;
      font-size: .75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .status-in-delivery { background: #dbeafe; color: #2563eb; }
    .status-delivered   { background: #dcfce7; color: #16a34a; }
    .order-item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; font-size: .87rem;
      border-bottom: 1px solid var(--beige);
    }
    .order-item-row:last-child { border-bottom: none; }
    .order-totals {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 4px; margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--beige-dark);
    }
    .order-total-row {
      display: flex; justify-content: flex-end; gap: 16px;
      font-size: .85rem; color: var(--gray);
    }
    .order-total-row.grand {
      font-weight: 700; color: var(--dark); font-size: .95rem;
    }
    .order-meta {
      display: flex; flex-wrap: wrap; gap: 16px;
      margin-top: 14px; font-size: .8rem; color: var(--gray);
    }
    /* Countdown badge */
    .countdown-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #eff6ff; color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 20px; padding: 5px 14px;
      font-size: .8rem; font-weight: 600;
      margin-top: 14px;
    }
    .countdown-badge svg { flex-shrink: 0; }
    .countdown-badge.delivered {
      background: #f0fdf4; color: #15803d; border-color: #bbf7d0;
    }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="nav-logo">Senim</a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="products.html">Furniture</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <button class="cart-btn" onclick="window.location.href='cart.html'" title="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="cart-count">0</span>
    </button>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="orders-page">
  <div class="orders-header">
    <p class="section-label">Account</p>
    <h1>My Orders</h1>
  </div>
  <div id="orders-container"></div>
</div>

<div class="toast-container"></div>
<script src="../js/main.js"></script>
<script>
  if (!Auth.isLoggedIn()) window.location.href = 'auth.html';

  function timeLeft(deliveryDateStr) {
    const now      = new Date();
    const delivery = new Date(deliveryDateStr + 'T23:59:59');
    const diff     = delivery - now;
    if (diff <= 0) return null; // delivered
    const days    = Math.floor(diff / 86400000);
    const hours   = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    return { days, hours, minutes, diff };
  }

  function formatCountdown(deliveryDateStr) {
    const t = timeLeft(deliveryDateStr);
    if (!t) return '<span class="countdown-badge delivered"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>Delivered</span>';
    const parts = [];
    if (t.days > 0)    parts.push(t.days + 'd');
    if (t.hours > 0)   parts.push(t.hours + 'h');
    parts.push(t.minutes + 'm left');
    return `<span class="countdown-badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
      ${parts.join(' ')}
    </span>`;
  }

  function renderOrders() {
    const container = document.getElementById('orders-container');
    const currentUser = Auth.getUser();
    const ordersKey   = currentUser ? `senim_orders_${currentUser.id}` : 'senim_orders_guest';
    const orders      = JSON.parse(localStorage.getItem(ordersKey) || '[]');

    if (orders.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          <h3 style="margin-top:20px">No orders yet</h3>
          <p style="margin:8px 0 24px;color:var(--gray)">Start shopping to see your orders here.</p>
          <a href="products.html" class="btn btn-primary">Browse Products</a>
        </div>`;
      return;
    }

    container.innerHTML = '';
    orders.forEach(order => {
      const isDelivered = timeLeft(order.deliveryDate) === null;
      const statusLabel = isDelivered ? 'Delivered' : 'In Delivery';
      const statusClass = isDelivered ? 'status-delivered' : 'status-in-delivery';
      const placedDate  = new Date(order.placedAt).toLocaleDateString('en-KZ', { year:'numeric', month:'long', day:'numeric' });
      const delivDate   = new Date(order.deliveryDate + 'T00:00:00').toLocaleDateString('en-KZ', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

      const card = document.createElement('div');
      card.className = 'order-card';
      card.setAttribute('data-delivery', order.deliveryDate);
      card.innerHTML = `
        <div class="order-card-header">
          <div>
            <div class="order-id">${order.id}</div>
            <div class="order-date">Placed on ${placedDate}</div>
          </div>
          <span class="order-status ${statusClass}">${statusLabel}</span>
        </div>
        <div class="order-items">
          ${order.items.map(item => `
            <div class="order-item-row">
              <span>${item.name} × ${item.quantity}</span>
              <span>${formatPrice(item.price * item.quantity)}</span>
            </div>`).join('')}
        </div>
        <div class="order-totals">
          <div class="order-total-row"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
          <div class="order-total-row"><span>Delivery</span><span>${order.delivery === 0 ? 'Free' : formatPrice(order.delivery)}</span></div>
          <div class="order-total-row grand"><span>Total</span><span>${formatPrice(order.total)}</span></div>
        </div>
        <div class="order-meta">
          <span>📍 ${order.address}</span>
          <span>📧 ${order.email}</span>
          <span>📞 ${order.phone}</span>
          <span>💳 ···· ${order.cardLast4}</span>
          <span>🚚 Expected: ${delivDate}</span>
        </div>
        <div class="countdown-area">${formatCountdown(order.deliveryDate)}</div>`;
      container.appendChild(card);
    });

    // Live countdown tick every minute
    setInterval(() => {
      document.querySelectorAll('.order-card').forEach(card => {
        const d = card.getAttribute('data-delivery');
        card.querySelector('.countdown-area').innerHTML = formatCountdown(d);
      });
    }, 60000);
  }

  renderOrders();
</script>
</body>
</html>
